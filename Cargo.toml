[package]
name = "tigrust"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.40"
hyper = { version = "1", features = ["full"]}
hyper-util = { version = "0.1", features = ["full"]}
http-body-util = "0.1"
graphql_client = "0.14.0"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
rocket = { version = "0.5.1", default-features = true, features=["json"]}
tokio = "1.44.0"

