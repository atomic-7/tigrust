[package]
name = "tigrust"
version = "0.1.0"
edition = "2024"

[dependencies]
# measure times
chrono = "0.4.40"
# http requests
hyper = { version = "1", features = ["full"]}
hyper-util = { version = "0.1", features = ["full"]}
http-body-util = "0.1"
# create the bodies for post requests, deserialize to struct
graphql_client = "0.14.0"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
# webserver framework
rocket = { version = "0.5.1", default-features = true, features=["json"]}
# async runtime
tokio = "1.44.0"
# use .env files
dotenv = "0.15.0"
# rust tls implementation for tokio
tokio-rustls = "0.26.2"
# Check tls certs againts certs on the platform
rustls-platform-verifier = "0.3"
svg = "0.18.0"

